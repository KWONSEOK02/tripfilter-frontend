name: ci

# 커밋 전 검증 루프를 main push와 PR에서 자동 실행함.
# 정본 루프는 typecheck 더하기 check 더하기 build (.agents/rules/verification-loop.md).
# check 는 색과 타이포 값이 globals.css 의 :root 밖에 직접 쓰였는지 보는 게이트임.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Hardcoded token check
        run: npm run check
      - name: Build
        run: npm run build
